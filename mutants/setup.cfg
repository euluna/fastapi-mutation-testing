[mutmut]
# The relative path to the file you are testing
paths_to_mutate=fastapi/fastapi/websockets.py

# Tell mutmut to copy the tests into the sandbox
# Keep the copy minimal to avoid missing deps from other tests
also_copy=fastapi/tests/test_dependency_after_yield_websockets.py

# Limit test discovery to only the relevant test file
tests_dir=fastapi/tests/test_dependency_after_yield_websockets.py

# The exact command to run the tests
# Using "python -m pytest" is safer than just "pytest" in Docker
runner=python -m pytest fastapi/tests/test_dependency_after_yield_websockets.py